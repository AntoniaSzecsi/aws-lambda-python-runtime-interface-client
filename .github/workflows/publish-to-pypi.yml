name: publish-to-pypi

# Builds the sdist and the platform wheels on CodeBuild-hosted self-hosted
# runners, then uploads them to PyPI (or TestPyPI) using a PyPI Trusted
# Publisher. No long-lived tokens and no GPG signatures are involved: PyPI
# stopped accepting GPG .asc signatures in 2023.
#
# Triggers
#   release: published  -> publishes the release tag to the production index
#   workflow_dispatch   -> build-only by default; opt in to an upload
#
# Required repository variables (Settings -> Secrets and variables -> Actions):
#   CODEBUILD_PROJECT_X86_64   name of the x86_64 CodeBuild runner project
# Optional repository variables, all for egress-locked runners:
#   PIP_INDEX_URL   CodeArtifact PyPI proxy. Make this a secret rather than a
#                   variable if the URL embeds a CodeArtifact auth token.
#   CIBW_IMAGE_BASE Registry prefix for the manylinux/musllinux build images,
#                   e.g. <acct>.dkr.ecr.<region>.amazonaws.com/quay/pypa for an
#                   ECR pull-through cache of quay.io. Unset pulls from quay.
#   CIBW_IMAGE_TAG  Dated pypa image tag, e.g. 2026.09.05-1. Required whenever
#                   CIBW_IMAGE_BASE is set.
#   ECR_REGISTRY    <acct>.dkr.ecr.<region>.amazonaws.com. When set, Docker logs
#                   in to it before building wheels.
#   AWS_REGION      Region for the ECR login. Defaults to us-west-2.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build. Defaults to the triggering ref.'
        type: string
        required: false
      target:
        description: 'Index to upload to.'
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      upload:
        description: 'Upload to the index. Leave unchecked for a build-only dry run.'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-to-pypi-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  # Python interpreters to build wheels for. Keep in sync with the classifiers
  # and python_requires in setup.py. Free-threaded (cp3XXt) and PyPy builds are
  # deliberately excluded: the RIC does not claim support for them yet.
  #
  # PROOF OF CONCEPT: cut to one interpreter so a run takes minutes instead of
  # most of an hour. Every part of the pipeline is still exercised, there is just
  # one wheel per libc instead of five. Restore the full set before shipping a
  # real release, otherwise 3.10, 3.11, 3.13 and 3.14 users get no wheel:
  #   CIBW_BUILD_VERSIONS: 'cp310 cp311 cp312 cp313 cp314'
  CIBW_BUILD_VERSIONS: 'cp312'
  CIBWHEEL_VERSION: '4.2.1'
  TWINE_VERSION: '6.2.0'

jobs:
  # Runs on a GitHub-hosted runner on purpose: it resolves the version and the
  # runner project names, and a missing project name has to fail loudly here
  # rather than leave a CodeBuild job hanging forever on an unmatched label.
  preflight:
    name: Resolve version and target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist_prefix: ${{ steps.resolve.outputs.dist_prefix }}
      ref: ${{ steps.resolve.outputs.ref }}
      target: ${{ steps.resolve.outputs.target }}
      index_base: ${{ steps.resolve.outputs.index_base }}
      upload_url: ${{ steps.resolve.outputs.upload_url }}
      upload: ${{ steps.resolve.outputs.upload }}
    steps:
      # Add CODEBUILD_PROJECT_AARCH64 here as well once the arm64 runner project
      # exists. See the aarch64 note on the build-wheels matrix below.
      - name: Check that the runner projects are configured
        env:
          PROJECT_X86_64: ${{ vars.CODEBUILD_PROJECT_X86_64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in PROJECT_X86_64; do
            if [ -z "${!name:-}" ]; then
              echo "Repository variable CODEBUILD_${name#PROJECT_} is not set." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the CodeBuild runner project names before releasing." >&2
            exit 1
          fi

      - name: Check out the ref being built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve version, index and upload decision
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' awslambdaric/__init__.py)"
          if [ -z "$version" ]; then
            echo "Could not determine __version__ from awslambdaric/__init__.py" >&2
            exit 1
          fi

          # Read the distribution name rather than assuming it, so that pointing
          # a fork at a scratch PyPI project only means editing setup.py. PEP 625
          # normalises the name in filenames: lower case, and any run of "-", "_"
          # or "." becomes a single "_". So name="awslambdaric-lszecsi" produces
          # awslambdaric_lszecsi-<version>.tar.gz.
          dist_name="$(sed -n 's/^[[:space:]]*name="\([^"]*\)".*/\1/p' setup.py | head -1)"
          if [ -z "$dist_name" ]; then
            echo "Could not determine the distribution name from setup.py" >&2
            exit 1
          fi
          dist_prefix="$(printf '%s' "$dist_name" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[-_.]+/_/g')"

          # release-on-version-change.yml tags bare versions, with no leading "v".
          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$RELEASE_TAG" != "$version" ]; then
              echo "Release tag '$RELEASE_TAG' does not match __version__ '$version'." >&2
              echo "Bump awslambdaric/__init__.py and re-tag rather than publishing a mismatch." >&2
              exit 1
            fi
            ref="$RELEASE_TAG"
            target="pypi"
            upload="true"
          else
            ref="${INPUT_REF:-$GITHUB_SHA}"
            target="$INPUT_TARGET"
            upload="$INPUT_UPLOAD"
          fi

          # index_base is where the OIDC audience and mint-token endpoints live.
          # upload_url is the separate upload host, which differs for production:
          # PyPI mints at pypi.org but accepts uploads only at upload.pypi.org.
          case "$target" in
            pypi)
              index_base="https://pypi.org"
              upload_url="https://upload.pypi.org/legacy/"
              ;;
            testpypi)
              index_base="https://test.pypi.org"
              upload_url="https://test.pypi.org/legacy/"
              ;;
            *) echo "Unknown target '$target'." >&2; exit 1 ;;
          esac

          {
            echo "version=$version"
            echo "dist_prefix=$dist_prefix"
            echo "ref=$ref"
            echo "target=$target"
            echo "index_base=$index_base"
            echo "upload_url=$upload_url"
            echo "upload=$upload"
          } >> "$GITHUB_OUTPUT"

          echo "### Publish plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| distribution | \`$dist_name\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| version | \`$version\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ref | \`$ref\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| index | $index_base |" >> "$GITHUB_STEP_SUMMARY"
          echo "| upload to | $upload_url |" >> "$GITHUB_STEP_SUMMARY"
          echo "| upload | $upload |" >> "$GITHUB_STEP_SUMMARY"

  build-sdist:
    name: Build sdist
    needs: preflight
    runs-on:
      - codebuild-${{ vars.CODEBUILD_PROJECT_X86_64 }}-${{ github.run_id }}-${{ github.run_attempt }}
      # A unique label per job. Without it GitHub can hand a job to the runner
      # that CodeBuild started for a different job in the same workflow run.
      - awslambdaric-sdist
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build the source distribution
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PIP_INDEX_URL:-}" ]; then
            echo "::add-mask::${PIP_INDEX_URL}"
          fi
          python3 -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade "setuptools>=60" "wheel>=0.37.0"
          # BUILD=true keeps setup.py from compiling curl and aws-lambda-cpp:
          # an sdist carries the vendored sources and compiles at install time.
          BUILD=true /tmp/sdist-venv/bin/python setup.py sdist --dist-dir dist

      - name: Check the sdist contents
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          DIST_PREFIX: ${{ needs.preflight.outputs.dist_prefix }}
        run: |
          set -euo pipefail
          archive="dist/${DIST_PREFIX}-${VERSION}.tar.gz"
          test -f "$archive" || { echo "Expected $archive to exist." >&2; ls -la dist >&2; exit 1; }
          gzip -t "$archive"

          # List once into a file rather than piping tar into each grep. Piping
          # into "grep -q" is a trap here: grep exits on the first match, tar
          # keeps writing, takes SIGPIPE, and pipefail then reports the whole
          # pipeline as failed even though the entry was found.
          listing="$(mktemp)"
          tar -tzf "$archive" > "$listing"

          # The native extension only compiles at install time if the vendored
          # dependencies and the preinstall script travel inside the sdist.
          missing=0
          for required in \
            "${DIST_PREFIX}-${VERSION}/scripts/preinstall.sh" \
            "${DIST_PREFIX}-${VERSION}/awslambdaric/runtime_client.cpp" \
            "${DIST_PREFIX}-${VERSION}/deps/versions"; do
            if ! grep -qxF "$required" "$listing"; then
              echo "Missing $required in the sdist." >&2
              missing=1
            fi
          done

          if ! grep -qE "^${DIST_PREFIX}-[^/]+/deps/.*\.tar\.gz$" "$listing"; then
            echo "The sdist carries no vendored dependency tarballs." >&2
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "--- sdist contents ---" >&2
            cat "$listing" >&2
            exit 1
          fi
          echo "sdist looks complete ($(wc -l < "$listing" | tr -d ' ') entries)."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-wheels:
    name: Build ${{ matrix.libc }} ${{ matrix.arch }} wheels
    needs: preflight
    runs-on:
      - codebuild-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
      - awslambdaric-wheels-${{ matrix.libc }}-${{ matrix.arch }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Split by libc as well as by architecture. Each wheel recompiles curl and
      # aws-lambda-cpp from scratch, so one job per (arch, libc) keeps every job
      # inside a sane CodeBuild timeout and lets them run in parallel.
      #
      # aarch64 is not built yet: wheels have to be compiled on the architecture
      # they target, and there is only an x86_64 runner project so far. Once an
      # arm64 runner project exists, set CODEBUILD_PROJECT_AARCH64 and add:
      #
      #   - arch: aarch64
      #     libc: manylinux
      #     project: ${{ vars.CODEBUILD_PROJECT_AARCH64 }}
      #   - arch: aarch64
      #     libc: musllinux
      #     project: ${{ vars.CODEBUILD_PROJECT_AARCH64 }}
      #
      # Until then a release ships the sdist plus x86_64 wheels only, so arm64
      # consumers compile from the sdist at install time exactly as they do today.
      matrix:
        include:
          - arch: x86_64
            libc: manylinux
            project: ${{ vars.CODEBUILD_PROJECT_X86_64 }}
          - arch: x86_64
            libc: musllinux
            project: ${{ vars.CODEBUILD_PROJECT_X86_64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check that a container engine is available
        run: |
          set -euo pipefail
          # cibuildwheel builds Linux wheels inside manylinux/musllinux
          # containers, so the CodeBuild project must run in privileged mode.
          docker info >/dev/null 2>&1 || {
            echo "Docker is not usable on this runner." >&2
            echo "Enable privileged mode on the CodeBuild project." >&2
            exit 1
          }
          echo "Container engine available."

      # Only needed when the build images come from an ECR pull-through cache.
      # cibuildwheel shells out to "docker pull", so the daemon needs ECR
      # credentials in place before it runs. ECR fetches from quay.io on its own
      # network, which is why an egress-locked runner never needs quay reachable.
      - name: Log Docker in to ECR
        if: vars.ECR_REGISTRY != ''
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "Logged in to $ECR_REGISTRY."

      - name: Build wheels
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
          CIBW_ARCHS: ${{ matrix.arch }}
          # PIP_INDEX_URL on the job only reaches pip on the host. cibuildwheel
          # builds an explicit environment for the container and injects nothing
          # but PIP_DISABLE_PIP_VERSION_CHECK and PIP_ROOT_USER_ACTION, so
          # without this the in-container installs (the build frontend, and the
          # test requirements below) would bypass the configured index and go
          # straight to PyPI. An unset value is passed through as empty, which
          # pip treats as "use the default index".
          CIBW_ENVIRONMENT_PASS: PIP_INDEX_URL
          # Pin manylinux2014 (glibc 2.17) rather than taking the cibuildwheel
          # default, which has moved on to manylinux_2_28. Lambda still ships an
          # Amazon Linux 2 base image on glibc 2.26, and a 2_28 wheel would be
          # rejected there and silently fall back to an sdist compile.
          #
          # When CIBW_IMAGE_BASE is set, images are pulled from there instead of
          # quay.io. Point it at an ECR pull-through cache prefixed for quay, e.g.
          # <acct>.dkr.ecr.<region>.amazonaws.com/quay/pypa, which keeps the
          # runner off the public internet entirely.
          #
          # CIBW_IMAGE_TAG pins the pypa image build. It is a dated tag rather
          # than a digest on purpose: a pull-through cache populates itself on
          # first pull by tag, and pypa does not move a dated tag once published.
          # Leave it matching the tag cibuildwheel itself pins, so mirrored builds
          # and direct-from-quay builds use the same image.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ vars.CIBW_IMAGE_BASE && format('{0}/manylinux2014_x86_64:{1}', vars.CIBW_IMAGE_BASE, vars.CIBW_IMAGE_TAG) || 'manylinux2014' }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ vars.CIBW_IMAGE_BASE && format('{0}/manylinux2014_aarch64:{1}', vars.CIBW_IMAGE_BASE, vars.CIBW_IMAGE_TAG) || 'manylinux2014' }}
          CIBW_MUSLLINUX_X86_64_IMAGE: ${{ vars.CIBW_IMAGE_BASE && format('{0}/musllinux_1_2_x86_64:{1}', vars.CIBW_IMAGE_BASE, vars.CIBW_IMAGE_TAG) || 'musllinux_1_2' }}
          CIBW_MUSLLINUX_AARCH64_IMAGE: ${{ vars.CIBW_IMAGE_BASE && format('{0}/musllinux_1_2_aarch64:{1}', vars.CIBW_IMAGE_BASE, vars.CIBW_IMAGE_TAG) || 'musllinux_1_2' }}
          # BUILD is deliberately left unset so that setup.py runs
          # scripts/preinstall.sh inside the container and statically links the
          # vendored curl and aws-lambda-cpp for that exact platform.
          CIBW_BEFORE_ALL: ./scripts/ci/cibuildwheel-before-all.sh
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest mock parameterized
          # Runs against the installed wheel on the target platform, so unlike
          # the Makefile's test target this can include the tests that need the
          # compiled extension. The integration suite is excluded: it drives
          # Docker and the RIE, which Task 2 owns.
          CIBW_TEST_COMMAND: >-
            python -c "import runtime_client, awslambdaric; print('awslambdaric', awslambdaric.__version__)"
            && pytest -q tests --ignore=tests/integration
          CIBW_BUILD_VERBOSITY: '1'
        run: |
          set -euo pipefail
          # A CodeArtifact index URL carries a bearer token in userinfo, and
          # cibuildwheel echoes the container environment it builds. This repo is
          # public, so mask the value before anything can print it.
          if [ -n "${PIP_INDEX_URL:-}" ]; then
            echo "::add-mask::${PIP_INDEX_URL}"
          fi

          # Select the interpreters and the single libc flavour for this job.
          builds=""
          for v in $CIBW_BUILD_VERSIONS; do
            builds="${builds}${builds:+ }${v}-${{ matrix.libc }}_*"
          done
          export CIBW_BUILD="$builds"
          echo "CIBW_BUILD=$CIBW_BUILD"

          python3 -m venv /tmp/cibw-venv
          /tmp/cibw-venv/bin/pip install --upgrade pip
          /tmp/cibw-venv/bin/pip install "cibuildwheel==${CIBWHEEL_VERSION}"
          /tmp/cibw-venv/bin/cibuildwheel --output-dir wheelhouse

      - name: Summarise the wheels
        run: |
          set -euo pipefail
          ls -la wheelhouse
          count="$(find wheelhouse -name '*.whl' | wc -l | tr -d ' ')"
          test "$count" -gt 0 || { echo "No wheels were produced." >&2; exit 1; }
          echo "Built $count wheel(s) for ${{ matrix.libc }} ${{ matrix.arch }}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-wheels-${{ matrix.libc }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to ${{ needs.preflight.outputs.target }}
    needs: [preflight, build-sdist, build-wheels]
    runs-on:
      - codebuild-${{ vars.CODEBUILD_PROJECT_X86_64 }}-${{ github.run_id }}-${{ github.run_attempt }}
      - awslambdaric-publish
    timeout-minutes: 30
    # Gate the upload behind a GitHub environment, named after the target index.
    # Put required reviewers on "pypi" only, so that a production release needs a
    # second pair of eyes while TestPyPI iteration stays fast. Whatever name is
    # used here must also be set on the Trusted Publisher at the index, if the
    # publisher is configured with an environment.
    environment: ${{ needs.preflight.outputs.target }}
    permissions:
      # Needed to request the OIDC token that PyPI exchanges for an API token.
      id-token: write
      contents: read
    steps:
      # Checked out only for scripts/ci/mint_pypi_token.py. This runs before the
      # artifacts are downloaded because checkout cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List the artifacts to upload
        run: |
          set -euo pipefail
          ls -la dist
          find dist -name '*.whl' -o -name '*.tar.gz' | sort

      - name: Verify the artifacts match the release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          DIST_PREFIX: ${{ needs.preflight.outputs.dist_prefix }}
        run: |
          set -euo pipefail
          unexpected="$(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            ! -name "${DIST_PREFIX}-${VERSION}-*" ! -name "${DIST_PREFIX}-${VERSION}.tar.gz" || true)"
          if [ -n "$unexpected" ]; then
            echo "Artifacts are not ${DIST_PREFIX} ${VERSION}:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "All artifacts are ${DIST_PREFIX} ${VERSION}."

      - name: Skip the upload
        if: needs.preflight.outputs.upload != 'true'
        run: |
          echo "Dry run: built and validated the artifacts without uploading." >> "$GITHUB_STEP_SUMMARY"

      - name: Install twine
        if: needs.preflight.outputs.upload == 'true'
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PIP_INDEX_URL:-}" ]; then
            echo "::add-mask::${PIP_INDEX_URL}"
          fi
          python3 -m venv /tmp/twine-venv
          /tmp/twine-venv/bin/pip install --upgrade pip
          /tmp/twine-venv/bin/pip install "twine==${TWINE_VERSION}"
          /tmp/twine-venv/bin/twine check dist/*

      # This is the PyPI Trusted Publisher exchange done by hand, rather than via
      # pypa/gh-action-pypi-publish. The action is a composite action that
      # generates a Docker container action and pulls ghcr.io, which an
      # egress-locked release runner cannot reach. Doing it directly needs no
      # registry and no container: the only host involved is the index itself.
      #
      # The trade-off is that PEP 740 attestations are not produced. The action
      # generates those by signing with Sigstore, which would require reaching
      # fulcio.sigstore.dev, rekor.sigstore.dev, timestamp.sigstore.dev and
      # tuf-repo-cdn.sigstore.dev. None of those are on the release runner
      # allowlist, and PyPI has not accepted GPG signatures since 2023, so
      # uploads here are unsigned. Restoring provenance means allowlisting those
      # four hosts, not swapping in a different signing method.
      # A failure here is almost always a publisher mismatch rather than a
      # transport problem: the repository, workflow filename and environment in
      # the OIDC token all have to match what is configured on the index.
      - name: Mint a short-lived PyPI token from the GitHub OIDC token
        if: needs.preflight.outputs.upload == 'true'
        id: mint
        env:
          OIDC_BASE: ${{ needs.preflight.outputs.index_base }}
        run: |
          set -euo pipefail
          api_token="$(python3 scripts/ci/mint_pypi_token.py "$OIDC_BASE")"
          echo "::add-mask::${api_token}"
          echo "api_token=${api_token}" >> "$GITHUB_OUTPUT"

      - name: Upload to the index
        if: needs.preflight.outputs.upload == 'true'
        env:
          UPLOAD_URL: ${{ needs.preflight.outputs.upload_url }}
          TARGET: ${{ needs.preflight.outputs.target }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ steps.mint.outputs.api_token }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          set -euo pipefail
          # TestPyPI gets re-run repeatedly while iterating, so tolerate files
          # that are already there. Production fails loudly instead of quietly
          # masking a re-release of an existing version.
          if [ "$TARGET" = "testpypi" ]; then
            set -- --skip-existing
          else
            set --
          fi
          /tmp/twine-venv/bin/twine upload \
            --repository-url "$UPLOAD_URL" \
            --disable-progress-bar \
            "$@" \
            dist/*

      - name: Record the upload
        if: needs.preflight.outputs.upload == 'true'
        env:
          TARGET: ${{ needs.preflight.outputs.target }}
          DIST_PREFIX: ${{ needs.preflight.outputs.dist_prefix }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          echo "Uploaded \`${DIST_PREFIX} ${VERSION}\` to ${TARGET} (unsigned: no PEP 740 attestations)." \
            >> "$GITHUB_STEP_SUMMARY"

  attach-to-release:
    name: Attach artifacts to the GitHub Release
    needs: [preflight, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Upload the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
